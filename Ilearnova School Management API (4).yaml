  /api/admin/school/dashboard/activities/:
    get:
      operationId: admin_school_dashboard_activities_retrieve
      description: Get recent activities for the dashboard.
      summary: Recent school activity feed (newest first)
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: 1-50, default 10.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - all
          - event
          - exam
          - parent
          - student
          - teacher
        description: Default all.
      tags:
      - Organization Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardActivities'
              examples:
                MixedFeed:
                  value:
                    success: true
                    data:
                      activities:
                      - id: exam_7f0c...
                        type: exam
                        title: Exam submitted
                        description: Ada Obi submitted Maths Mid-term
                        timestamp: '2026-10-30T09:14:02+00:00'
                        user:
                          id: 3b1e...
                          name: Ada Obi
                        metadata:
                          exam_id: e21a...
                          attempt_id: 7f0c...
                      - id: join_91d2...
                        type: teacher
                        title: New teacher joined
                        description: Musa Bello joined as teacher
                        timestamp: '2026-10-29T15:40:11+00:00'
                        user:
                          id: c4aa...
                          name: Musa Bello
                        metadata:
                          user_id: c4aa...
                      total: 2
                      has_more: false
                  summary: Mixed feed
          description: ''
        '401':
