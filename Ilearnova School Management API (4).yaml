  /api/student/exams/session/{session_id}/answer/:
    put:
      operationId: student_exams_session_answer_update
      description: |-
        Autosave one answer; idempotent (same body = same result). Overwrites a
        previous answer until the attempt is finalized. After the server deadline
        the attempt is closed and 400 is returned.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Student
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CBTAnswerInRequest'
            examples:
              Mcq/TrueFalse:
                value:
                  answer: <option-uuid>
                summary: mcq / true_false
              McqMulti:
                value:
                  answer:
                  - <option-uuid>
                  - <option-uuid>
                summary: mcq_multi
              ShortAnswer/FillBlank:
                value:
                  answer: photosynthesis
                summary: short_answer / fill_blank
              Essay:
                value:
                  answer: Long free text...
                summary: essay
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CBTAnswerInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CBTAnswerInRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CBTAnswerOut'
              examples:
                Mcq/TrueFalse:
                  value:
                    answer: <option-uuid>
                  summary: mcq / true_false
                McqMulti:
                  value:
                    answer:
                    - <option-uuid>
                    - <option-uuid>
                  summary: mcq_multi
                ShortAnswer/FillBlank:
                  value:
                    answer: photosynthesis
                  summary: short_answer / fill_blank
                Essay:
                  value:
                    answer: Long free text...
                  summary: essay
          description: ''
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
