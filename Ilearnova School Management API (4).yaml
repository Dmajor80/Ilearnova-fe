          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        bio:
          type: string
          nullable: true
        profile_pic:
          type: string
          format: uri
          nullable: true
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        date_of_birth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        is_verified:
          type: boolean
          description: Global verification status
        date_joined:
          type: string
          format: date-time
          readOnly: true
        first_time_user:
          type: boolean
          description: First time user status to determine account type
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserOrganizationRole'
          readOnly: true
        organizations:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: |-
            Returns a list of organizations the user belongs to with the roles in each.
            Shape:
            [
            {
                "organization": {...},
                "roles": [
                {"code": "...", "name": "...", "is_verified": true},
                ...
                ]
            },
            ...
            ]
          readOnly: true
        primary_role:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Returns the user's most relevant (primary) active role to guide redirection.
            Picks a verified active role first, then any active role.
            Shape:
            {
            "organization": {...},
            "role": {"code": "...", "name": "..."}
            } or None
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - organizations
      - primary_role
      - roles
      - username
    UserOrganizationRole:
      type: object
      description: Serializer for UserOrganizationRole model
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
        organization:
          allOf:
          - $ref: '#/components/schemas/Organization'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRole'
          readOnly: true
        is_active:
          type: boolean
        is_verified:
          type: boolean
          description: Role-specific verification status
        assigned_at:
          type: string
          format: date-time
          readOnly: true
        verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        additional_data:
          description: Role-specific additional data (e.g., employee ID, student ID,
            etc.)
      required:
      - assigned_at
      - id
      - organization
      - role
      - user
      - verified_at
    UserOrganizationRoleRequest:
      type: object
      description: Serializer for UserOrganizationRole model
      properties:
        user:
          type: string
          format: uuid
        is_active:
          type: boolean
        is_verified:
          type: boolean
          description: Role-specific verification status
        additional_data:
          description: Role-specific additional data (e.g., employee ID, student ID,
            etc.)
      required:
      - user
    UserRequest:
      type: object
      description: Enhanced user serializer with role information
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        bio:
          type: string
          nullable: true
        profile_pic:
          type: string
          format: binary
          nullable: true
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        date_of_birth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        is_verified:
          type: boolean
          description: Global verification status
        first_time_user:
          type: boolean
          description: First time user status to determine account type
      required:
      - email
      - username
    UserRole:
      type: object
      description: Serializer for UserRole model
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          description: Unique code for programmatic access
          maxLength: 50
        description:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/UserRoleCategoryEnum'
        is_active:
          type: boolean
        requires_verification:
          type: boolean
          description: Whether users with this role need verification
        can_have_multiple:
          type: boolean
          description: Whether a user can have multiple instances of this role
      required:
      - code
      - id
      - name
    UserRoleCategoryEnum:
      enum:
      - admin
      - academic
      - student
      - parent
      - support
      - external
      type: string
      description: |-
        * `admin` - Administrative
        * `academic` - Academic
        * `student` - Student
        * `parent` - Parent/Guardian
        * `support` - Support Staff
        * `external` - External
    UserRoleRequest:
      type: object
      description: Serializer for UserRole model
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          description: Unique code for programmatic access
          maxLength: 50
        description:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/UserRoleCategoryEnum'
        is_active:
          type: boolean
        requires_verification:
          type: boolean
          description: Whether users with this role need verification
        can_have_multiple:
          type: boolean
          description: Whether a user can have multiple instances of this role
      required:
      - code
      - name
    UserSelectsTypeRequest:
      type: object
      properties:
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        name:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        phone_number:
          type: string
          minLength: 1
      required:
      - account_type
    VerifyOTPRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        otp:
          type: string
          minLength: 6
          maxLength: 6
      required:
      - email
      - otp
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Super Admin
  description: Platform-wide management. Requires a Django superuser or an active
    `superadmin` role. 401 without a token, 403 otherwise.
- name: Organization Admin
  description: School-level management, scoped to the caller's organization. Requires
    an active `org_admin` role.
- name: Teacher
  description: Requires a `teacher` role.
- name: Student
  description: Requires a `student` role; data is always the authenticated student's
    own.
- name: Parent
  description: Requires a `parent` role.
- name: Messaging
  description: 1:1 direct messages for any signed-in school member. Students and parents
    can only message teachers and school admins.
- name: Auth & Public
  description: Login, registration and public lookups.
