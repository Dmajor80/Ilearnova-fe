components:
  schemas:
    AccountTypeEnum:
      enum:
      - individual
      - organization
      type: string
      description: |-
        * `individual` - individual
        * `organization` - organization
    AdminRegistration:
      type: object
      description: Serializer for registeration of an admin or a single user
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        bio:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        date_of_birth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        additional_data: {}
      required:
      - email
      - username
    AdminRegistrationRequest:
      type: object
      description: Serializer for registeration of an admin or a single user
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        bio:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
          maxLength: 20
        date_of_birth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        password:
          type: string
          writeOnly: true
          minLength: 1
        additional_data: {}
      required:
      - email
      - password
      - username
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        message:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - id
      - message
      - title
    AnnouncementRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        message:
          type: string
          minLength: 1
      required:
      - message
      - title
    Assignment:
      type: object
      description: Serializer for Assignment model
      properties:
        id:
          type: string
