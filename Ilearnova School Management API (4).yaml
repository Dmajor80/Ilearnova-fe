openapi: 3.0.3
info:
  title: Ilearnova School Management API
  version: v1
  description: |-
    Comprehensive API for the Ilearnova multi-tenant school management platform.

    ## Authentication
    Most endpoints require JWT authentication. Include your token in the Authorization header: `Authorization: Bearer <your_token>`
  contact:
    email: support@ilearnova.com
  license:
    name: Proprietary License
paths:
  /api/admin/classes/:
    get:
      operationId: admin_classes_retrieve
      description: Placeholder; returns empty data. Use school/* ViewSets.
      tags:
      - Organization Admin
      security:
      - jwtAuth: []
      - cookieAuth: []
      - jwtAuth: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  message:
                    type: string
                  code:
                    type: string
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
                  message:
                    type: string
                  code:
