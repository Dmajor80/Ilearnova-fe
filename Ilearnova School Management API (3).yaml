openapi: 3.0.3
info:
  title: Ilearnova School Management API
  version: v1
  description: |-
    Comprehensive API for the Ilearnova multi-tenant school management platform.

    ## Authentication
    Most endpoints require JWT authentication. Include your token in the Authorization header: `Authorization: Bearer <your_token>`
